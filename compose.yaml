services:
  server:
    build: .
    restart: unless-stopped
    environment:
      INVENTORY_DB_URL: jdbc:mariadb://db:3306/inventory?connectTimeout=5000&socketTimeout=10000&timezone=UTC
      INVENTORY_DB_USER: inventory
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Run setup-local.ps1 first}
      INVENTORY_API_TOKEN: ${INVENTORY_API_TOKEN:?Run setup-local.ps1 first}
      INVENTORY_OPERATOR: Inventory team
      INVENTORY_HOST: 0.0.0.0
      INVENTORY_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: inventory
      MARIADB_USER: inventory
      MARIADB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Run setup-local.ps1 first}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Run setup-local.ps1 first}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - inventory-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  inventory-data:
